name: Ops image

# Push to the `ops` branch -> build the combined image and push it to GHCR.
# That is the whole job: this fork publishes a *candidate*, it does not deploy.
#
# Which image runs is pinned in cinderblock/ops:
#   sentinel (https://ghidra.tomsawyerlabs.com, LAN only)
#     servers/sentinel/stacks/ghidra/pin.json
#
# Shipping a build is two steps: push here, then paste the pin.json this run
# prints into ops and push ops.
#
# This is a fork of bethington/ghidra-mcp. Upstream's own workflows are
# disabled in this fork; this one is the only one that should run here. The
# `ops` branch takes upstream changes by MERGE (never rebase), so it never
# needs a force-push. See ops/README.md.
on:
  push:
    branches: [ops]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }} # cinderblock/ghidra-mcp

concurrency:
  group: ops-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Test the sample upload drop
        run: python3 -m unittest discover -s ops -v

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: bake
        uses: docker/bake-action@v7
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        with:
          source: .
          files: ops/docker-bake.hcl
          targets: image
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Smoke-test the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ github.sha }}
        run: |
          set -eux
          docker pull "$IMAGE"
          docker run --rm --entrypoint /opt/bridge/bin/bridge-mcp-ghidra "$IMAGE" --help >/dev/null
          docker run --rm --entrypoint python3 "$IMAGE" -c 'import ast,sys; ast.parse(open("/app/samples_server.py").read())'
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${{ github.sha }}"

      - name: Summarize how to deploy this build
        env:
          DIGEST: ${{ fromJSON(steps.bake.outputs.metadata).image['containerimage.digest'] }}
        run: |
          {
            echo "### Image published"
            echo
            echo '```json'
            echo '{'
            echo '  "image": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}",'
            echo "  \"digest\": \"${DIGEST}\","
            echo '  "source": {'
            echo '    "repo": "${{ github.repository }}",'
            echo '    "commit": "${{ github.sha }}"'
            echo '  }'
            echo '}'
            echo '```'
            echo
            echo 'Paste into `servers/sentinel/stacks/ghidra/pin.json` in cinderblock/ops and push.'
            echo "Nothing reaches sentinel until you do."
          } >> "$GITHUB_STEP_SUMMARY"
